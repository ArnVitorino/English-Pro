<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4" filter="url(#glow)" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" stroke-dasharray="12 12" />
  
  <!-- Tech & Sales Microphone Icon -->
  <path d="M256 160 C234 160 216 178 216 200 L216 260 C216 282 234 300 256 300 C278 300 296 282 296 260 L296 200 C296 178 278 160 256 160 Z" fill="#ffffff" filter="url(#glow)" />
  <path d="M186 245 C186 285 218 316 256 316 C294 316 326 285 326 245" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="316" x2="256" y2="355" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" />
  <line x1="220" y1="355" x2="292" y2="355" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" />
  
  <!-- Monogram EP text below -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">ENGLISH PRO</text>
</svg>

